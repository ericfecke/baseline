name: Phase 0 — validate free data path

# Proves the whole Phase 0 chain runs unattended, on a schedule, entirely on
# GitHub-hosted infrastructure: fetch hoopR-nba-data box scores from GitHub
# raw (no stats.nba.com call, so the datacenter-IP block never applies —
# see DATA.md §1-2), derive team/player ratings, print a sanity summary.
#
# This is the Phase 0 validation script (ingest/phase0_validate.py), not the
# real Phase 1 ingest pipeline (no DB write yet — that's Phase 1 scope).

on:
  schedule:
    - cron: "0 11 * * *"  # ~6am ET / 11am UTC, matching DATA.md §3's target nightly window
  workflow_dispatch: {}    # manual trigger, for proving it works without waiting for the schedule

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch current-season box scores from hoopR-nba-data (GitHub raw)
        run: |
          set -euo pipefail
          mkdir -p fixtures
          # -f: fail loudly on a non-2xx response instead of silently writing
          # an HTML error page to the file, which the next step would then
          # try to parse as parquet and fail on with a useless error.
          curl -fsSL -o fixtures/player_box_2026.parquet \
            "https://raw.githubusercontent.com/sportsdataverse/hoopR-nba-data/main/nba/player_box/parquet/player_box_2026.parquet"
          curl -fsSL -o fixtures/team_box_2026.parquet \
            "https://raw.githubusercontent.com/sportsdataverse/hoopR-nba-data/main/nba/team_box/parquet/team_box_2026.parquet"
          ls -la fixtures/
          # Sanity check: real parquet files here are hundreds of KB; a
          # truncated or error-page download would be tiny. Fail fast and
          # visibly rather than let it surface as an opaque pandas error.
          for f in fixtures/player_box_2026.parquet fixtures/team_box_2026.parquet; do
            size=$(stat -c%s "$f")
            if [ "$size" -lt 10000 ]; then
              echo "::error::$f is only $size bytes — looks like a failed download, not real parquet data"
              exit 1
            fi
          done

      - name: Derive ratings and print validation summary
        run: python ingest/phase0_validate.py
